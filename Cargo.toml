[package]
name = "gpulens"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Plain-language GPU monitor: shows which apps are using your GPU and why"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/guitaripod/gpulens"
keywords = ["gpu", "nvidia", "tui", "monitor", "nvml"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.6.11"
directories = "6.0.0"
nix = { version = "0.31.3", features = ["signal", "user"] }
nvml-wrapper = "0.13"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-width = "0.2.2"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
httpmock = "0.8.3"
insta = "1.49.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
